# Colector de APIs públicas en la nube (MonitorAqua). Corre aunque la PC del equipo esté apagada.
#
# Cada 30 min hace UNA pasada de ingesta/colector_apis.py en modo ventana: pide todas las lecturas de las últimas
# 6 h de ThingSpeak, EA UK, USGS y Open-Meteo y las escribe en Firebase (/board1/lecturas/historial), la misma
# entrada del ESP32. Las ventanas se solapan y la clave es determinística: reescribir no duplica.
#
# GitHub NO garantiza el cron: puede atrasar o saltarse ejecuciones (la primera noche, 2026-10-29, no disparó
# ninguna entre 01:45 y 08:40, y después faltaron las de 09:07, 09:37 y 10:07). La ventana de 6 h es la protección: basta
# una pasada verde cada menos de 6 h para que no quede ningún hueco. Al encender la PC, el puente se pone al día.
#
# Requisitos (Settings -> Secrets and variables -> Actions):
#   Secrets:   FIREBASE_API_KEY, FIREBASE_DB_URL, FIREBASE_EMAIL, FIREBASE_PASSWORD (los mismos de .env);
#              USGS_API_KEY es opcional
#   El código del colector se toma de main (desde la fusión de las ramas U2, 2026-10-29; la variable temporal
#   COLECTOR_REF ya no se usa).
#   Con la PC encendida corre a la vez que el colector local, sin duplicados (misma clave fija).
#   Si los minutos no alcanzan: cron "7 * * * *" (una vez por hora), sin perder datos gracias a la ventana de 6 h.
# GitHub solo dispara los "schedule" desde la rama por defecto (main): este archivo tiene que estar en main.
#
# Costo: ~45 s por ejecución (1 min facturado) x 48 al día = ~1,440 min/mes, dentro de los 2,000 min/mes gratis de
# un repo privado con plan Free. Si el cupo se acerca al límite, cambiar a cada hora ("7 * * * *").
name: colector-apis

on:
  schedule:
    - cron: "7,37 * * * *"   # minutos desfasados de la hora en punto, cuando GitHub está más cargado
  workflow_dispatch:          # botón "Run workflow" para probar a mano

concurrency:
  group: colector-apis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # la misma de la imagen de ingesta
          cache: pip
          cache-dependency-path: ingesta/requirements.txt

      - run: pip install -r ingesta/requirements.txt

      - name: Pasada con ventana de 6 h
        working-directory: ingesta
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          FIREBASE_PATH: /board1/lecturas/historial
          EDAD_MAX_H: "7"                 # edad máxima de una lectura escrita: mayor que la ventana de 6 h
        run: python colector_apis.py --una-vez --ventana-min 360
