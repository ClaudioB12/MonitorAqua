# Capa de servicio de MonitorAqua sobre el stack lambda26 (F1).
# No crea otro Kafka ni otro Prometheus: se une a la red lambda26-kafka-net.
#
# Uso (desde la raíz del repo, para que tome el .env):
#   docker compose -f infra/compose.yml --env-file .env up -d
name: monitoraqua-infra

services:
  influxdb:
    image: influxdb:2.7.12
    container_name: lambda26-influxdb
    restart: unless-stopped
    ports:
      - "48086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - monitoraqua_influxdb_data:/var/lib/influxdb2
      - monitoraqua_influxdb_config:/etc/influxdb2
    # U3 (hardening, S14): "listo" no es lo mismo que "arrancó". influx ping consulta /health dentro del contenedor.
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lambda26-kafka-net

  # Reemplaza al Grafana de lambda26/obs: mismo contenedor, puerto y volumen de datos,
  # pero con el provisioning versionado en este repo (infra/grafana/ y dashboards/).
  grafana:
    image: grafana/grafana:11.4.0
    container_name: lambda26-grafana
    restart: unless-stopped
    ports:
      - "43000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      # F5: capturas reproducibles de los tableros (docs/evidencias/f5/) con el renderizador oficial
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - lambda26_grafana_data:/var/lib/grafana
    # U3 (hardening, S14): Grafana espera a que InfluxDB esté sano, no solo arrancado, y declara su propia salud
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - lambda26-kafka-net

  # Renderizador de Grafana (F5): /render/d/<uid> devuelve el tablero como PNG
  renderer:
    image: grafana/grafana-image-renderer:3.11.0
    container_name: lambda26-grafana-renderer
    restart: unless-stopped
    networks:
      lambda26-kafka-net:
        aliases: [renderer]

  # --- Ingesta (F2): misma imagen, dos procesos -----------------------------------
  # Reemplaza a lambda26-aqua-bridge: NO correr ambos a la vez (publicarían dos veces).
  aqua-puente:
    build:
      context: ..
      dockerfile: ingesta/Dockerfile
    image: monitoraqua-ingesta:latest
    container_name: lambda26-aqua-puente
    restart: unless-stopped
    command: ["python", "puente_firebase_kafka.py"]
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092   # dentro de la red; el .env trae localhost:49092 para el host
      ESTADO_PATH: /estado/puente.json
    volumes:
      - monitoraqua_ingesta_estado:/estado
    networks:
      - lambda26-kafka-net

  aqua-colector:
    image: monitoraqua-ingesta:latest
    container_name: lambda26-aqua-colector
    restart: unless-stopped
    command: ["python", "colector_apis.py"]
    env_file: ../.env
    depends_on:
      - aqua-puente   # comparte la imagen que construye aqua-puente
    networks:
      - lambda26-kafka-net

  # --- Eventos de servicio (F4): consumidor en vivo de servicio-eventos -------------------
  aqua-consumidor-eventos:
    image: monitoraqua-ingesta:latest
    container_name: lambda26-aqua-consumidor-eventos
    restart: unless-stopped
    command: ["python", "consumidor_eventos.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PYTHONUNBUFFERED: "1"
    networks:
      - lambda26-kafka-net

  # --- Volumen por tópico (F5, costos de F8): bytes en disco y mensajes cada 5 min ---------
  aqua-volumen:
    image: monitoraqua-ingesta:latest
    container_name: lambda26-aqua-volumen
    restart: unless-stopped
    command: ["python", "volumen_kafka.py"]
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      INFLUX_URL_INTERNA: http://influxdb:8086
    networks:
      - lambda26-kafka-net

  # --- Speed layer (F3): Spark Structured Streaming sobre aqua-eventos-real --------------
  aqua-streaming:
    build:
      context: ..
      dockerfile: streaming/Dockerfile
    image: monitoraqua-streaming:latest
    container_name: lambda26-aqua-streaming
    restart: unless-stopped
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      INFLUX_URL_INTERNA: http://influxdb:8086
      CHECKPOINT_DIR: /checkpoints
      BRONCE_DIR: /datos/bronce
      SENSORES_PRUEBA_PATH: /app/config/ingesta/sensores_prueba.yml
      TANQUES_PATH: /app/config/ingesta/tanques.yml
      REGLAS_SERVICIO_PATH: /app/config/streaming/reglas_servicio.yml
      MODELOS_DIR: /app/config/modelos                       # F7: parámetros de los modelos de F6 (solo lectura)
      KAFKA_TOPIC_AUMENTADOS: aqua-eventos-aumentados        # F7: la flota extrapolada para las predicciones
    ports:
      - "4043:4040"   # Spark UI del job (4042 es la de lambda26-pyspark)
    volumes:
      - monitoraqua_spark_checkpoints:/checkpoints
      - ../data/local/bronce:/datos/bronce
      # Carpetas (no archivos sueltos): así el contenedor ve los cambios de sensores_prueba.yml, tanques.yml y
      # reglas_servicio.yml aunque el editor reemplace el archivo
      - ../ingesta:/app/config/ingesta:ro
      - ../streaming:/app/config/streaming:ro
      - ../batch/modelos:/app/config/modelos:ro                                 # F7: se recargan al cambiar
      - ../data/local/validacion:/datos/validacion                          # salida de validar_detector.py
    depends_on:
      - influxdb
    networks:
      - lambda26-kafka-net

  # --- Prueba de carga (F8): el mismo job sobre un tópico de prueba. Solo con --profile carga -----------------------
  # Tópico aqua-carga-prueba, bucket monitoraqua_carga, checkpoint y bronce propios: no toca el tópico real ni sus
  # salidas. Preparación y etapas: infra/prueba_carga.py
  aqua-streaming-carga:
    image: monitoraqua-streaming:latest
    container_name: lambda26-aqua-streaming-carga
    profiles: [carga]
    # CARGA_MASTER: núcleos de Spark local (local[*] = todos). Con local[*] y 24 núcleos, la primera corrida murió por
    # falta de memoria junto al job de producción (docs/costos-escalado.md)
    command: ["spark-submit", "--master", "${CARGA_MASTER:-local[*]}", "--packages",
              "org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0", "--driver-memory", "1g",
              "--conf", "spark.ui.port=4040", "procesar_stream.py"]
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${CARGA_TOPICO:-aqua-carga-prueba}
      KAFKA_TOPIC_AUMENTADOS: ${CARGA_TOPICO:-aqua-carga-prueba}
      # Los eventos de servicio de los tanques de prueba van a su propio tópico, nunca a servicio-eventos (en la
      # corrida del 30-oct, sin esta línea, el .env los mandó al tópico real: docs/evidencias/f8/)
      KAFKA_TOPIC_SERVICIO: ${CARGA_TOPICO:-aqua-carga-prueba}-servicio
      STARTING_OFFSETS: latest
      INFLUX_URL_INTERNA: http://influxdb:8086
      INFLUX_BUCKET: monitoraqua_carga
      INFLUX_BUCKET_AUMENTADOS: monitoraqua_carga
      CHECKPOINT_DIR: /checkpoints
      BRONCE_DIR: /datos/bronce
      SENSORES_PRUEBA_PATH: /app/config/ingesta/sensores_prueba.yml
      TANQUES_PATH: /app/config/carga/tanques.yml          # tanques de producción + carga-NNNNN
      REGLAS_SERVICIO_PATH: /app/config/streaming/reglas_servicio.yml
      MODELOS_DIR: /app/config/modelos
    ports:
      - "4044:4040"
    volumes:
      - monitoraqua_carga_checkpoints:/checkpoints
      - monitoraqua_carga_bronce:/datos/bronce
      - ../ingesta:/app/config/ingesta:ro
      - ../streaming:/app/config/streaming:ro
      - ../batch/modelos:/app/config/modelos:ro
      - ../data/local/carga:/app/config/carga:ro
    networks:
      - lambda26-kafka-net

volumes:
  monitoraqua_carga_checkpoints:
  monitoraqua_carga_bronce:
  monitoraqua_spark_checkpoints:
  monitoraqua_ingesta_estado:
  monitoraqua_influxdb_data:
  monitoraqua_influxdb_config:
  lambda26_grafana_data:
    external: true
    name: lambda26-obs_lambda26_grafana_data

networks:
  lambda26-kafka-net:
    external: true
    name: lambda26-kafka-net
