  # USGS Water Data API (OGC, latest-continuous), cuenca del río Delaware (NY/PA/NJ/DE).
  # Las 10 miden temperatura del agua (00010, °C), pH (00400) y oxígeno disuelto (00300, mg/L).
  # Una sola consulta por pasada para las 10. Clave opcional: USGS_API_KEY en .env.
  usgs:
    habilitada: true
    intervalo_s: 900
    recarga_max_dias: 7
    estaciones:
      - {id: USGS-01433500, nombre: "Mongaup River near Mongaup NY", lat: 41.4612, lon: -74.7588}
      - {id: USGS-01438500, nombre: "Delaware River at Montague NJ", lat: 41.3092, lon: -74.7953}
      - {id: USGS-01454700, nombre: "Lehigh River at Glendon PA", lat: 40.6693, lon: -75.2363}
      - {id: USGS-01463500, nombre: "Delaware River at Trenton NJ", lat: 40.2217, lon: -74.7781}
