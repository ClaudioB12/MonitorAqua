# Estaciones del colector de APIs (F2). Verificadas el 2026-10-28; ver docs/ingesta.md.
# intervalo_s: cada cuánto se consulta la fuente. Cada fuente corre aislada en su hilo.
# recarga_max_dias: hasta cuántos días atrás recarga el colector al arrancar (colector_apis.py), según el
#   historial que da cada API: ThingSpeak corta en 8,000 lecturas (~5.5 días en los canales de 1/min);
#   EA UK y USGS guardan semanas; Open-Meteo minutely_15 da al menos 7 días.

fuentes:

  # Canales públicos de nivel de tanque. Solo se incluyen los que tenían una lectura de
  # menos de 24 h al verificarlos. campos: medida del contrato -> fieldN del canal.
  thingspeak:
    habilitada: true
    intervalo_s: 300
    recarga_max_dias: 5
    # 7 de 22 canales activos (<24 h) entre 212 candidatos; los otros 15 no son tanques o
    # tienen datos inválidos (lista completa en docs/ingesta.md). escalas: factor de conversión.
    canales:
      - {id: 283977, nombre: "House Water Tank Reporting", campos: {nivelPct: field1}}
      - {id: 480876, nombre: "Water Tank Levels & Temp/Humidity", campos: {nivelPct: field1, temperaturaC: field3, humedadPct: field4}}
      - {id: 1233810, nombre: "House Water Tank (24k L)", campos: {nivelPct: field1}}
      - {id: 1233815, nombre: "Veggie Water Tank (24k L)", campos: {nivelPct: field1}}
      - {id: 1272968, nombre: "WaterLevelMonitor", campos: {distanciaCm: field1}}
      # F7: field2 (aire dentro del tanque) como temperaturaC: con él, D8 estima el agua en vivo y la compara con
      # field3 (DS18B20), el único dato real de agua (pronóstico vs real del tablero)
      - {id: 3418755, nombre: "Rain water harvesting monitoring", campos: {nivelM: field1, temperaturaC: field2, tempAguaC: field3}, escalas: {nivelM: 0.01}}
      - {id: 3019316, nombre: "Nivel Carcamo", campos: {distanciaCm: field4}}

  # Environment Agency UK, cuenca "Thames from Hurley to Teddington" (23 estaciones, una cuenca,
  # comparables). nivelM = stage aguas arriba (m sobre el cero de la estación, mASD; 2 en mAOD);
  # caudalM3s solo en las 6 estaciones de aforo. Publican cada 15 min con ~45 min de atraso.
  ea_uk:
    habilitada: true
    intervalo_s: 900
    recarga_max_dias: 7
    cuenca: Thames from Hurley to Teddington
    estaciones:
