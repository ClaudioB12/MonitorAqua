  # Open-Meteo: clima actual de Juliaca (sin clave). El modelo actualiza "current" cada 15 min.
  open_meteo:
    habilitada: true
    intervalo_s: 900
    recarga_max_dias: 7
    ubicaciones:
      - {id: juliaca, lat: -15.49, lon: -70.13}
      # F7: ubicación de ThingSpeak 3418755 (noroeste de Inglaterra), para que D8 en vivo use el modelo validado
      # (aire de la cámara + Open-Meteo). sensorId open-meteo-canal3418755: no se mezcla con Juliaca
      - {id: canal3418755, lat: 53.45, lon: -2.51}
